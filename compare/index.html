<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сравнение изображений</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 20px;
        font-family: Arial, sans-serif;
        background: #222;
        color: #fff;
    }

    h1 {
        margin-top: 0;
        font-size: 22px;
    }

    .info {
        margin-bottom: 20px;
        color: #bbb;
    }

    .pair {
        margin-bottom: 35px;
        border-bottom: 1px solid #555;
        padding-bottom: 25px;
    }

    .filename {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    .compare {
        display: flex;
        gap: 10px;
        width: 100%;
    }

    .panel {
        width: 50%;
        min-height: 400px;
        background: #444;
        border: 1px solid #666;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
    }

    .panel img {
        display: block;
        max-width: 100%;
        max-height: 80vh;
        width: auto;
        height: auto;
        object-fit: contain;
    }

    .label {
        position: absolute;
        top: 8px;
        left: 8px;
        padding: 5px 10px;
        background: rgba(0,0,0,0.7);
        font-size: 13px;
        z-index: 10;
    }

    .empty {
        padding: 30px;
        background: #333;
        border: 1px solid #555;
    }
</style>
</head>

<body>

<h1>Сравнение изображений</h1>

<div class="info">
    Слева — original, справа — output
</div>

<div id="container"></div>

<script>
async function loadImages() {
    const response = await fetch("/images.json");
    const pairs = await response.json();

    const container = document.getElementById("container");

    if (!pairs.length) {
        container.innerHTML = `
            <div class="empty">
                Не найдено изображений с одинаковыми именами
                в папках original и output.
            </div>
        `;
        return;
    }

    for (const pair of pairs) {
        const block = document.createElement("div");
        block.className = "pair";

        block.innerHTML = `
            <div class="filename">${pair.name}</div>

            <div class="compare">

                <div class="panel">
                    <div class="label">ОРИГИНАЛ</div>
                    <img src="${pair.original}">
                </div>

                <div class="panel">
                    <div class="label">ОБРАБОТАННОЕ</div>
                    <img src="${pair.output}">
                </div>

            </div>
        `;

        container.appendChild(block);
    }
}

loadImages();
</script>

</body>
</html>
